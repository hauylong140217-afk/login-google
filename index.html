<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập Google</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Thêm thư viện Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #18191a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    #userInfo { margin-top: 20px; text-align: center; }
  </style>
</head>
<body>
  <h2>Đăng nhập Messenger HTA</h2>
  
  <div id="buttonDiv"></div>
  <div id="userInfo"></div>

  <script>
    // 1. Cấu hình Firebase Realtime Database
    var firebaseConfig = {
      databaseURL: "https://messager-65f58-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);

    // 2. Lấy session ID từ URL do HTA gửi sang
    var urlParams = new URLSearchParams(window.location.search);
    var sessionId = urlParams.get('session');

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function handleCredentialResponse(response) {
      const data = parseJwt(response.credential);
      
      document.getElementById('userInfo').innerHTML = `
        <p><strong>Xin chào:</strong> ${data.name}</p>
        <p><strong>Email:</strong> ${data.email}</p>
        <p style="color:#45bd62; font-size:13px;">Đăng nhập thành công! Đang quay lại HTA...</p>
      `;

      // 3. Đẩy thông tin người dùng lên Firebase
      if (sessionId) {
        firebase.database().ref("active_sessions/" + sessionId).set({
          uid: data.sub, // ID duy nhất từ Google
          name: data.name,
          email: data.email,
          picture: data.picture
        }).then(function() {
          setTimeout(function() { window.close(); }, 1200);
        });
      }
    }

    window.onload = function () {
      google.accounts.id.initialize({
        client_id: "357000228017-c25mjbhcmfajqq4ccsk3brdabuj39j0e.apps.googleusercontent.com",
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById("buttonDiv"),
        { theme: "outline", size: "large", text: "signin_with" } 
      );

      google.accounts.id.prompt();
    }
  </script>
</body>
</html>
