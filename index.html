<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập Google</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #18191a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    #userInfo { margin-top: 20px; text-align: center; }
  </style>
</head>
<body>
  <h2>Đăng nhập Messenger HTA</h2>
  
  <div id="buttonDiv"></div>
  <div id="userInfo"></div>

  <script>
    var firebaseConfig = {
      databaseURL: "https://messager-65f58-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function handleCredentialResponse(response) {
      const data = parseJwt(response.credential);
      
      document.getElementById('userInfo').innerHTML = `
        <p><strong>Xin chào:</strong> ${data.name}</p>
        <p style="color:#45bd62; font-size:13px;">Đăng nhập thành công! Bạn có thể đóng trang này.</p>
      `;

      // Đẩy dữ liệu trực tiếp vào nút 'latest_login' trên Firebase
      firebase.database().ref("latest_login").set({
        uid: data.sub,
        name: data.name,
        email: data.email,
        time: new Date().getTime()
      }).then(function() {
        setTimeout(function() { window.close(); }, 1500);
      });
    }

    window.onload = function () {
      google.accounts.id.initialize({
        client_id: "357000228017-c25mjbhcmfajqq4ccsk3brdabuj39j0e.apps.googleusercontent.com",
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById("buttonDiv"),
        { theme: "outline", size: "large", text: "signin_with" } 
      );
    }
  </script>
</body>
</html>
