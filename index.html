<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập Google</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <h2>Trang Đăng Nhập</h2>
  
  <!-- Nút đăng nhập Google -->
  <div id="buttonDiv"></div>

  <!-- Nơi hiển thị thông tin sau khi đăng nhập -->
  <div id="userInfo" style="margin-top: 20px;"></div>

  <script>
    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function handleCredentialResponse(response) {
      const data = parseJwt(response.credential);
      
      document.getElementById('userInfo').innerHTML = `
        <p><strong>Xin chào:</strong> ${data.name}</p>

        <p><strong>Email:</strong> ${data.email}</p>

        <img src="${data.picture}" alt="Avatar" style="border-radius: 50%; width: 80px;">
      `;
    }

    window.onload = function () {
      google.accounts.id.initialize({
        client_id: "357000228017-c25mjbhcmfajqq4ccsk3brdabuj39j0e.apps.googleusercontent.com",
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById("buttonDiv"),
        { theme: "outline", size: "large", text: "signin_with" } 
      );

      google.accounts.id.prompt();
    }
  </script>
</body>
</html>
