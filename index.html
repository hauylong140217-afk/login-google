<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập bằng Google</title>
    <!-- Firebase JS SDK -->
<script>
    // Config Firebase
    var firebaseConfig = {
        databaseURL: "https://messager-65f58-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);

    // Lấy Session ID từ URL
    var urlParams = new URLSearchParams(window.location.search);
    var sessionId = urlParams.get('session');

    function signInWithGoogle() {
        var provider = new firebase.auth.GoogleAuthProvider();
        
        // Ép Google luôn hiển thị bảng chọn tài khoản
        provider.setCustomParameters({
            prompt: 'select_account'
        });

        document.getElementById("status").innerText = "Đang mở cửa sổ Google...";

        // Thực hiện đăng nhập khi bấm nút
        firebase.auth().signInWithPopup(provider).then(function(result) {
            var user = result.user;
            document.getElementById("status").innerHTML = "<b style='color:#4caf50'>Đăng nhập thành công!</b><br>Đang quay lại HTA...";

            // Lưu dữ liệu lên Firebase
            if (sessionId) {
                firebase.database().ref("active_sessions/" + sessionId).set({
                    uid: user.uid,
                    name: user.displayName
                }).then(function() {
                    setTimeout(function() { window.close(); }, 1200);
                });
            }
        }).catch(function(error) {
            document.getElementById("status").innerText = "Lỗi: " + error.message;
        });
    }

    // LƯU Ý: Xóa bỏ hoặc không dùng đoạn window.onload tự động gọi signInWithGoogle() nữa!
</script>

</body>
</html>
