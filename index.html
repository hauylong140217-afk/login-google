<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập bằng Google</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; text-align: center; max-width: 360px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .google-btn { background: #ffffff; color: #3c4043; border: none; padding: 12px 20px; border-radius: 24px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; margin-top: 15px; }
        .google-btn:hover { background: #f8f9fa; }
        #status { font-size: 13px; color: #aaa; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Đăng nhập Messenger HTA</h2>
    <p style="font-size:13px; color:#888;">Chọn tài khoản Google của bạn để tiếp tục</p>
    
    <button class="google-btn" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 18 18">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.616z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
        </svg>
        Đăng nhập bằng Google
    </button>

    <div id="status"></div>
</div>

<script>
    var firebaseConfig = {
        databaseURL: "https://messager-65f58-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);

    var urlParams = new URLSearchParams(window.location.search);
    var sessionId = urlParams.get('session');

    // Lưu sessionId vào sessionStorage để không bị mất khi redirect trang
    if (sessionId) {
        sessionStorage.setItem("current_session", sessionId);
    } else {
        sessionId = sessionStorage.getItem("current_session");
    }

    // Tự động kiểm tra kết quả sau khi Google chuyển hướng quay trở lại trang
    firebase.auth().getRedirectResult().then(function(result) {
        if (result.user) {
            var user = result.user;
            document.getElementById("status").innerHTML = "<b style='color:#4caf50'>Đăng nhập thành công!</b><br>Đang cập nhật HTA...";

            if (sessionId) {
                firebase.database().ref("active_sessions/" + sessionId).set({
                    uid: user.uid,
                    name: user.displayName
                }).then(function() {
                    setTimeout(function() { window.close(); }, 1200);
                });
            }
        }
    }).catch(function(error) {
        document.getElementById("status").innerText = "Lỗi: " + error.message;
    });

    function signInWithGoogle() {
        var provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        document.getElementById("status").innerText = "Đang chuyển sang Google...";
        
        // Chuyển hướng trực tiếp trang web thay vì mở popup
        firebase.auth().signInWithRedirect(provider);
    }
</script>

</body>
</html>
